name: Docker Build & Push

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME }}
  REGISTRY: docker.io
  NAMESPACE: ${{ vars.DOCKER_NAMESPACE }}
  AUTH_KEYS: ${{ secrets.SSH_KEY_PUBLIC }}
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Create authorized_keys file
        run: |
          echo "${AUTH_KEYS}" >authorized_keys
          echo "Done creating up authorized_keys file"
      - name: Compute image tag
        id: meta
        run: |
          BASE="${REGISTRY}/${NAMESPACE}/${IMAGE_NAME}"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            # Version release: push both the version tag and latest
            { echo "TAGS<<EOF"; printf '%s\n' "${BASE}:${GITHUB_REF_NAME}" "${BASE}:latest"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          else
            { echo "TAGS<<EOF"; echo "${BASE}:latest"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./docker
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.TAGS }}
          build-args: |
            BUILD_TAG=${{ github.ref_name }}
          cache-from: |
            type=gha
            ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/{1}/{2}:buildcache', env.REGISTRY, env.NAMESPACE, env.IMAGE_NAME) || '' }}
          cache-to: |
            type=gha,mode=max
            ${{ github.event_name != 'pull_request' && format('type=registry,mode=max,ref={0}/{1}/{2}:buildcache', env.REGISTRY, env.NAMESPACE, env.IMAGE_NAME) || '' }}

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk -v ver="$VERSION" \
            '$0 == "## [" ver "]" {flag=1; next} flag && /^## \[/{exit} flag' \
            CHANGELOG.md)
          if [ -n "$NOTES" ]; then
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag --title "$GITHUB_REF_NAME" --notes "$NOTES"
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi
